name: Build Multi-App Android APK

on:
  push:
    branches: [ "main", "virtual-android-engine-foundation" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-app-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Multi-App
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Install Gradle
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Multi-App-foundation
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
