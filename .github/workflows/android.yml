name: Build Multi-App Android APK

on:
  push:
    branches: [ "main", "virtual-android-engine-foundation" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-app-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Multi-App and QubeVM engine
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;30.0.16248370"
          yes | sdkmanager --licenses

      - name: Install QEMU native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gettext git libtool-bin make ninja-build patch pkg-config python3-venv rsync texinfo unzip wget zip
          python3 -m venv /tmp/qemu-tools
          /tmp/qemu-tools/bin/pip install --upgrade pip meson mako
          echo "/tmp/qemu-tools/bin" >> "$GITHUB_PATH"

      - name: Fetch and prepare pinned QEMU dependencies
        working-directory: engine/QubeVM/qube-android-lib/src/main/jni
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/qemu.tar.xz https://download.qemu.org/qemu-11.1.2.tar.xz
          tar -xJf /tmp/qemu.tar.xz
          mv qemu-11.1.2 qemu

          curl -fsSLo /tmp/glib.tar.xz https://download.gnome.org/sources/glib/2.90/glib-2.90.1.tar.xz
          tar -xJf /tmp/glib.tar.xz
          mv glib-2.90.1 glib

          curl -fsSLo /tmp/libffi.tar.gz https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz
          tar -xzf /tmp/libffi.tar.gz
          mv libffi-3.8.0 libffi

          curl -fsSLo /tmp/pixman.tar.gz https://gitlab.freedesktop.org/pixman/pixman/-/archive/pixman-0.46.4/pixman-pixman-0.46.4.tar.gz
          tar -xzf /tmp/pixman.tar.gz
          mv pixman-pixman-0.46.4 pixman
          (cd pixman && bash autogen.sh)

          curl -fsSLo /tmp/slirp.zip https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.5/libslirp-v4.9.5.zip
          mkdir -p qemu/subprojects
          unzip -q /tmp/slirp.zip -d /tmp/slirp
          mv /tmp/slirp/libslirp-v4.9.5 qemu/subprojects/libslirp

          curl -fsSLo /tmp/epoxy.zip https://github.com/anholt/libepoxy/archive/refs/tags/1.5.10.zip
          unzip -q /tmp/epoxy.zip -d /tmp/epoxy
          mv /tmp/epoxy/libepoxy-1.5.10 libepoxy

          git clone --depth 1 https://gitlab.freedesktop.org/virgl/virglrenderer.git virglrenderer

          patch -p1 -d qemu < patches/qemu-11.1.2.patch
          patch -p1 -d glib < patches/glib-2.90.1.patch
          patch -p1 -d qemu/subprojects/libslirp < patches/libslirp-4.9.5.patch
          patch -p1 -d virglrenderer < patches/virglrenderer-1.3.0-android-egl.patch

      - name: Build QEMU ARM64 for Android (TCG, no host root)
        working-directory: engine/QubeVM/qube-android-lib/src/main/jni
        env:
          BUILD_HOST: arm64-v8a
          BUILD_GUEST: aarch64-softmmu
          USE_QEMU_VERSION: 11.1.2
          BUILD_THREADS: 2
          USE_KVM: false
        run: |
          set -euo pipefail
          export NDK_ROOT="$ANDROID_SDK_ROOT/ndk/30.0.16248370"
          make qube

      - name: Stage QEMU ARM64 native library
        run: |
          set -euo pipefail
          mkdir -p engine/QubeVM/qube-android-lib/src/main/jniLibs/arm64-v8a
          cp engine/QubeVM/qube-android-arm/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so engine/QubeVM/qube-android-lib/src/main/jniLibs/arm64-v8a/
          test -s engine/QubeVM/qube-android-lib/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so
          find engine/QubeVM/qube-android-lib/src/main/jniLibs/arm64-v8a -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Install Gradle
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.8.2/bin" >> "$GITHUB_PATH"

      - name: Build Multi-App release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Multi-App-QEMU-ARM64
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
